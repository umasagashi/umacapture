<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The umacapture mark: a horseshoe (uma) inside the four corners of a viewfinder (capture).
       Drawn for this repository. The tile is the app's light primary (#1565C0), the same in light
       and dark: a page shows the mark as an image, which cannot read the page's colours. -->
  <rect width="64" height="64" rx="16" fill="#1565C0"/>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 20V10h10M44 10h10v10M54 44v10H44M20 54H10V44" stroke-width="3.5"/>
    <path d="M22 17v16a10 10 0 0 0 20 0V17" stroke-width="7.5"/>
  </g>
  <g fill="#1565C0">
    <circle cx="22" cy="24" r="1.6"/><circle cx="22" cy="31" r="1.6"/>
    <circle cx="42" cy="24" r="1.6"/><circle cx="42" cy="31" r="1.6"/>
  </g>
</svg>
