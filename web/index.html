<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!--
    Cross-origin isolation shim (coi-serviceworker).

    The Wasm recognition core is built -pthread and therefore requires
    SharedArrayBuffer, which browsers gate behind cross-origin isolation
    (crossOriginIsolated === true, via COOP: same-origin + COEP: require-corp).
    The deployed site gets those headers from the server: web/_headers is copied
    into build/web/ and Cloudflare attaches COOP/COEP to every static response,
    so the page is isolated on the first load and this shim returns before
    registering anything (it checks window.crossOriginIsolated first).
    Flutter's dev server (flutter run, 3.44.4) cannot inject those headers, so
    there this service-worker shim re-serves every response with them and
    reloads once into the isolated context. It works under `flutter run -d
    chrome`, `flutter run -d web-server`, and any static host that sends no
    headers, using only cross-engine standards (Service Worker + COOP/COEP).

    Third-party vendored file (tracked in git):
      coi-serviceworker v0.1.7, MIT (c) Guido Zuidhof and contributors
      https://github.com/gzuidhof/coi-serviceworker
      Obtained via `npm pack coi-serviceworker@0.1.7`.

    Loaded early (before the Flutter bootstrap below) so isolation is in place
    before main.dart.js instantiates the pthreads Wasm module.
  -->
  <script src="coi-serviceworker.js"></script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Application for the game Umamusume players.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="umacapture">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>umacapture</title>
  <link rel="manifest" href="manifest.json">
  <script src="splash/splash.js"></script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <link rel="stylesheet" type="text/css" href="splash/style.css">
</head>
<body>
  <!--
    Official Flutter bootstrap loader (Flutter 3.44 template).

    flutter_bootstrap.js boots the engine once the build has substituted its
    tokens. This page cannot decide what that file does -- so the file itself
    is committed at web/flutter_bootstrap.js rather than left to the build to
    generate. It calls _flutter.loader.load() with no serviceWorkerSettings,
    which is what actually keeps a Flutter service worker from ever being
    registered; the generated default would register the offline-first one.
    See that file for the full reason.

    Do NOT write a build-time token (the double-brace form) anywhere in this
    file, comments included: substitution is a plain text replacement over the
    whole file, so a token merely quoted in prose inlines the entire contents
    of flutter.js right here.

    Cross-origin isolation comes from the server's COOP/COEP headers when it
    sends them, and otherwise from the coi-serviceworker shim loaded in <head>;
    a second (offline-first) Flutter service worker at scope "/" would fight the
    shim and cause COI flip-flop.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
