name: CI

# Runs the native C++ (doctest) suite, the Flutter unit/widget suite and the
# browser-only Dart suites on every PR to develop. Pushes to develop run no tests:
# they run warm-caches.yml, which keeps the develop-scoped caches these jobs
# restore (see the top of that file for why the merge commit needs no second run).
# The jobs that build or test run on GitHub-hosted windows-2022: the native tests
# need MSVC (and a downloaded OpenCV, see below), and the app is Windows-only.
#
# Every cache warm-caches.yml warms is defined once, in an action under
# .github/actions/ that the jobs here use too; do not inline one of them here.
#
# The two required checks are the job names "Native C++ tests (doctest)" and
# "Flutter unit/widget tests". The second is an aggregate: the Flutter work is split
# into parallel jobs (three test shards, static checks, the web build) because
# `flutter test` compiles one test file at a time, so one job running every file
# is bounded by that serial compile no matter how many cores it has. The aggregate
# fails unless every one of those jobs succeeded. "Native C++ coverage" and
# "Browser tests" are not required checks.
on:
  pull_request:
    branches: [develop]

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native C++ tests (doctest)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Puts cl.exe / the MSVC toolchain on PATH for every later step (exported via
      # GITHUB_ENV).
      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # uv runs native/wasm/check_sources.py (stdlib-only). Unconditional: the wasm drift gate
      # below runs on every job, cache hit or not. The provisioning actions further down set uv up
      # for themselves on a cache miss, since other jobs use them without this step.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # Drift gate for the two hand-maintained copies the Wasm build depends on and
      # that no compiler cross-checks: native/wasm/build.sh's SOURCES/EXCLUDED_SOURCES
      # must together cover native/src exactly, and wasm_recognizer_models.cpp must
      # instantiate makePredictor for the same decoders as the desktop definition
      # (recognizer_prediction.h declares them). A new native/src/**.cpp is
      # otherwise simply absent from the Wasm module, with no signal until someone
      # runs build.sh by hand -- which is why it lives in the job that owns those
      # sources, right next to where they are compiled for Windows.
      #
      # This is a DRIFT gate, not a compile gate: it never invokes em++. See the
      # comment on "Flutter web release build" in the flutter-web job for why no emsdk
      # compile job exists yet.
      - name: Check wasm source drift
        run: uv run native/wasm/check_sources.py

      # Restored from cache, or provisioned on a miss with tool/fetch_deps.py; the key, the path
      # and the reasoning behind each live in the action (shared with warm-caches.yml).
      - name: OpenCV
        uses: ./.github/actions/provision-opencv

      - name: FFmpeg
        uses: ./.github/actions/provision-ffmpeg

      # Ninja + Debug are required (see native/test/README.md); asserts are live in Debug.
      - name: Configure (CMake + Ninja, Debug)
        run: cmake -G Ninja -S native -B native/cmake-build-tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build umacapture_tests
        run: cmake --build native/cmake-build-tests --target umacapture_tests

      # Separate libav-linked target for the FFV1 recorder/reader round-trip (bit-exact color + timestamps).
      - name: Build umacapture_ffv1_tests
        run: cmake --build native/cmake-build-tests --target umacapture_ffv1_tests

      # COMPILED, NOT RUN. The mimic player needs a display surface and a clip, so there is nothing
      # for CI to execute -- but an uncompiled translation unit is an unverified one, and this one
      # shares src/cv/ffv1_avio.h and src/cv/ffv1_pixfmt.h with the recorder that IS tested above.
      # Without this step a change on the recorder side breaks the live-capture harness invisibly,
      # and it is discovered at the moment someone needs to run a live scenario. The target needs
      # nothing this job does not already have: the same configured build tree, the same provisioned
      # OpenCV and FFmpeg as umacapture_ffv1_tests, and d3d11/dxgi/dwmapi from the Windows SDK.
      - name: Build umacapture_mimic_player
        run: cmake --build native/cmake-build-tests --target umacapture_mimic_player

      # The integration suites self-skip (exit 77) here: we build only umacapture_tests, not the
      # ONNX-linked cli they drive, and the local-only clips/models are absent too -- so ctest
      # reports them Skipped rather than Failed. (uv is on PATH from the fetch step above, which is
      # what registers these tests; the run.py / run_dual_decode.py harnesses handle the missing cli.)
      #
      # They are registered as one ctest per case (integration_golden.<name> and
      # integration_dual_decode.<name>, plus the single tests that are not per case:
      # integration_golden_coverage and the harness selftests), so this log
      # names every case that did not run instead of collapsing them into a single line. That is the
      # point of the split: ctest hides the stdout of a passing or skipped test, so coverage has to be
      # carried by test status, and a partial local run must not be able to look like a full one.
      #
      # EXPECT EVERY REGISTERED INTEGRATION TEST TO SKIP HERE, EXCEPT THE ONES THAT DRIVE NO CLI AND
      # READ NO CLIP, WHICH MUST SAY Passed. Those are the harness selftests: each exercises one of the
      # harness's own decision tables against synthetic input, so there is no machine on which it is
      # allowed to skip, and each is registered without SKIP_RETURN_CODE for exactly that reason. The
      # exception is that condition, not a list of names: in native/CMakeLists.txt they are the
      # integration add_test entries that are NOT appended to INTEGRATION_TESTS / DUAL_DECODE_TESTS,
      # the two lists given SKIP_RETURN_CODE 77. For example integration_coverage_selftest pins
      # run.py --coverage's decision table, which keeps the coverage alarm from being disarmed by a
      # damaged baseline file, and integration_check_selftest pins check_run's claims decided from the
      # summary line alone, such as a declared factor-switch verdict count. They are the part of the
      # golden suite CI can actually verify. The expected number of "***Skipped"
      # lines is deliberately NOT written down: derive it from native/test/integration/cases.json,
      # which is where it changes -- one integration_dual_decode per case, one integration_golden per
      # case that states a `golden` or an `expect_records`, plus integration_golden_coverage (see the
      # registration in native/CMakeLists.txt). A literal here goes stale the moment a case is added,
      # which is exactly what happened to the "~12" that used to stand in this line. What has to hold
      # is the shape, not a count: none of the cli-driven ones may say Passed, because a passing
      # integration test that drives the cli would mean the cli had somehow been built.
      #
      # umacapture_tests is excluded here and run by the next step instead: ctest counts the doctest
      # binary as one test and hides its case count on success.
      - name: Run ctest
        run: ctest --test-dir native/cmake-build-tests --output-on-failure -E '^umacapture_tests$'

      # The gate for umacapture_tests, and the one place its own summary (the "test cases: N | N
      # passed" line) reaches the log, filtered so the tests' intentional error-path spdlog lines
      # don't look like real failures. On a failure the whole output is printed and the step fails
      # with the binary's exit code. The working directory is the build tree because that is where
      # ctest runs a test registered without WORKING_DIRECTORY, which is how native/CMakeLists.txt
      # registers this one (no test properties at all) -- so the binary runs as ctest would run it.
      - name: Run doctest (umacapture_tests)
        shell: pwsh
        working-directory: native/cmake-build-tests
        run: |
          $out = & .\umacapture_tests.exe 2>&1
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $out
            exit $code
          }
          $out | Select-String -Pattern 'test cases:|assertions:|Status:'

  # ---- P2: coverage visibility ----
  # A separate job and deliberately NOT a required check. Coverage is a view, not a gate: no
  # threshold is compared and nothing reads the report automatically; it exists for a person to
  # open the `native-coverage` artifact (native/test/README.md, "Coverage"). It re-runs the Debug
  # test binary under instrumentation, several times slower than the plain run in native-tests,
  # so keeping it inside that required job put the slowest run of the binary on every PR's path
  # to merge. The price is stated rather than hidden: a failure here -- including the install
  # retries below giving up -- shows red on the PR but does not block the merge.
  native-coverage:
    name: Native C++ coverage
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The same action, and so the same cache, as native-tests. FFmpeg is not provisioned:
      # only umacapture_tests is built here, and it links OpenCV alone.
      - name: OpenCV
        uses: ./.github/actions/provision-opencv

      - name: Configure (CMake + Ninja, Debug)
        run: cmake -G Ninja -S native -B native/cmake-build-tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build umacapture_tests
        run: cmake --build native/cmake-build-tests --target umacapture_tests

      # The chocolatey community feed intermittently 504s, and `choco install`
      # exits 0 even when it fetched 0 packages, so a transient outage would
      # otherwise sail past this step and only surface as a confusing "exe not
      # found" in "Measure coverage". Retry until the binary actually exists, and
      # fail loudly if it never appears -- coverage is never silently skipped: a
      # persistent feed outage turns this job red rather than passing green.
      - name: Install OpenCppCoverage
        shell: pwsh
        run: |
          $exe = "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
          foreach ($attempt in 1..5) {
            Write-Host "Installing OpenCppCoverage (attempt $attempt/5)..."
            choco install opencppcoverage -y --no-progress
            if (Test-Path $exe) { exit 0 }
            Write-Warning "OpenCppCoverage not present after attempt $attempt (chocolatey feed may be flaky); retrying in 30s..."
            Start-Sleep -Seconds 30
          }
          Write-Error "OpenCppCoverage could not be installed after 5 attempts; failing so coverage is not silently skipped."
          exit 1

      # Runs the Debug test binary under instrumentation and exports HTML + Cobertura.
      # --sources native\src keeps the report to backend code (substring match excludes
      # vendored headers and the test TUs). Uses the full exe path because choco's PATH
      # update is not visible to this step.
      - name: Measure coverage
        run: >
          & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
          --sources native\src
          --excluded_sources native\vendor
          --export_type cobertura:native\coverage\coverage.xml
          --export_type html:native\coverage\html
          -- native\cmake-build-tests\umacapture_tests.exe

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage
          path: native/coverage
          if-no-files-found: warn

  # The required check "Flutter unit/widget tests". It runs no work of its own: it only decides
  # whether the Flutter jobs it depends on all succeeded. `if: always()` is what makes it a gate.
  # Without it, a failed, cancelled or skipped dependency would make GitHub skip this job, and a
  # skipped job reports Success to branch protection -- the required check would pass with the
  # tests never having passed. So it always runs, and fails on any result other than `success`
  # (a matrix job's result is the combined result of its shards). ubuntu-latest because it runs
  # no project code, and it is the runner that picks such a job up soonest.
  flutter-tests:
    name: Flutter unit/widget tests
    needs: [flutter-test-shards, flutter-static, flutter-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Flutter job to have succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # The Dart VM test suite, split by FILE across three jobs. Unit/widget only: the
  # Windows-desktop integration_test (needs a full app build + uv) is intentionally excluded.
  #
  # WHY BY FILE, and not `flutter test --total-shards`: flutter_tools compiles test files one at a
  # time, and that serial compile is what bounds this suite (new suites start at a steady ~1.3 s
  # each whatever the core count). --total-shards is handed to package:test, which slices the
  # test cases *inside* each suite after loading it, so every shard would still compile every
  # file. Giving each job a third of the files is what divides the compile.
  #
  # WHICH FILES: tool/test_selection.dart decides from a scan of test/, so there is no list here
  # to keep up to date and a new test file is picked up without an edit. Before printing anything
  # it checks that every *_test.dart is routed to exactly one of these shards or the browser job,
  # and it fails the step if not (see the top of that file). It hands the files out longest-first
  # and each shard names its longest suite first, because flutter_tools starts suites in the order
  # they are named: a single long suite placed last would run on alone after everything else.
  #
  # NO build_runner here. The tests compile against the committed generated outputs, which is
  # what ships; the flutter-static job fails when those are out of date.
  #
  # Coverage is deliberately not collected: --coverage roughly doubles the wall-clock
  # (VM-service instrumentation) for a report that has no enforced threshold and only served as a
  # visibility artifact. -j 4 raises the suite-level parallelism from the default (cores/2 = 2 on
  # the 4-vCPU Windows runner); flutter's own issue tracker reports the speedup plateaus around 4.
  # --reporter github emits GitHub Actions annotations for failures and a more compact log.
  flutter-test-shards:
    name: Flutter tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: windows-2022
    strategy:
      # Every shard reports its own failures instead of being cancelled by a sibling's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      # The pinned SDK and `flutter pub get`, both restored from cache. Every Flutter job in
      # this workflow uses this action, and so does warm-caches.yml; the pin and the cache
      # settings live there.
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # The selection is checked before it is used: if tool/test_selection.dart exits non-zero,
      # this step fails without running anything. That check is explicit because pwsh does not
      # stop on a native command's non-zero exit, and an empty file list would make
      # `flutter test` run the whole test/ directory instead.
      - name: Run tests
        shell: pwsh
        run: |
          $files = & dart tool/test_selection.dart vm ${{ strategy.job-index }} ${{ strategy.job-total }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "::group::Test files in this shard, in the order they are handed to flutter test"
          $files | ForEach-Object { Write-Host $_ }
          Write-Host "::endgroup::"
          flutter test -j 4 --reporter github @files

  flutter-static:
    name: Flutter static checks
    if: false
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The same action as flutter-test-shards; see the comment there.
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # Persist build_runner's incremental state (.dart_tool/build holds the asset graph
      # of input content digests) so codegen only regenerates changed outputs instead of
      # rebuilding from scratch every run. Correctness is preserved regardless of what is
      # restored: build_runner re-validates every tracked input by digest on each run, and
      # discards the whole graph on a builder/dependency/SDK version change. The key busts
      # on pubspec.lock/build.yaml changes as a belt-and-suspenders; restore-keys keeps the
      # incremental benefit across unrelated commits. The one cache here that warm-caches.yml does
      # not warm (see the note there), which is why it is defined inline and not in an action.
      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'build.yaml') }}
          restore-keys: |
            build-runner-${{ runner.os }}-

      # --force-jit is required in this repo (a transitive native build hook is
      # incompatible with build_runner's default AOT). Generated outputs are committed; this
      # step regenerates them so the next step can compare the result against what was
      # committed. A BROKEN generator fails here; a STALE or forgotten regeneration fails there.
      #
      # The build filter restricts codegen to the lib/ and test/ outputs (mappers,
      # routes) that the tests compile against, and skips DistributionInfoBuilder --
      # its release-only license/version assets scan the gitignored
      # windows/{opencv,onnxruntime,clip} dirs, which are not provisioned in this job.
      #
      # WHY assets/ IS SNAPSHOTTED AND PUT BACK. A --build-filter run against a COLD asset graph
      # DELETES the committed generated outputs that fall outside the filter -- the same hazard the
      # "Verify web license disclosure" step below is ordered around, only there it is stated for the
      # lib/** outputs. Here it takes out DistributionInfoBuilder's four build_to: source outputs
      # (assets/{version,license,additional_license,web_license}_info.json). The graph is cold
      # whenever the cache above misses, which any change to pubspec.lock or build.yaml causes, so
      # this is the normal case on such a branch and not an edge one. Putting them back keeps every
      # later step of this job on the committed tree rather than on one with four committed files
      # missing.
      # NOT fixed by widening the filter to assets/**: test/licence_disclosure_windows_test.dart
      # exists to catch a committed disclosure that no longer describes windows/runner/CMakeLists.txt,
      # and a disclosure regenerated moments earlier always agrees with it -- the check would still
      # look like a check while having become incapable of failing. The test shards read the
      # COMMITTED bytes straight from the checkout, and so must anything here that reads assets/. The
      # whole directory is snapshotted rather than a list of four names: nothing else in assets/
      # changes during this step, and a list would go stale the first time a fifth generated output
      # lands there.
      # shell: bash so a failing command fails the step (see "Run JavaScript tests" in flutter-web).
      - name: Code generation (build_runner)
        shell: bash
        run: |
          committed_assets="$(mktemp -d)"
          cp -r assets "$committed_assets/assets"
          dart run build_runner build --force-jit --build-filter "lib/**" --build-filter "test/**"
          cp -r "$committed_assets/assets/." assets/

      # THE STALENESS GATE. The test shards and the web build compile against the committed
      # generated outputs without running build_runner, so a regeneration someone forgot has to fail
      # here, or it ships green. `git status`, not `git diff`: diff does not see a NEW untracked
      # output (the *.mapper.dart of a newly annotated class), which is exactly what a forgotten
      # regeneration can leave behind. The scope is the build filter above. assets/ is outside it:
      # the step above restored it from the committed bytes, and the license step below deliberately
      # generates a smaller CI artifact there (see its comment).
      # This relies on the outputs being byte-stable on this runner: .gitattributes pins them to
      # eol=lf, which is what build_runner writes, so an unchanged output compares clean under the
      # runner's core.autocrlf.
      - name: Check generated outputs are committed
        shell: bash
        run: |
          drift="$(git status --porcelain --untracked-files=all -- lib test)"
          if [ -n "$drift" ]; then
            echo "::error::build_runner output differs from the committed files. Run 'dart run build_runner build --force-jit' and commit the result."
            echo "$drift"
            git --no-pager diff --stat -- lib test
            exit 1
          fi

      # --no-fatal-infos keeps errors and warnings fatal but tolerates pre-existing
      # info-level lints (e.g. annotate_overrides) that also exist on develop.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # `tool` is in scope too: tool/check_web_pins.dart is Dart the pre-commit hook
      # formats but CI would otherwise never see (the hook is opt-in per clone and
      # bypassable with --no-verify, so CI is the only durable gate).
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test tool

      # The step above is the only gate in this workflow that the pre-commit hook
      # also performs. Its other two -- the colour-literal rule and the pins over
      # the gitignored web/wasm/* -- have no equivalent here or under test/, so the
      # hook is the whole of their enforcement, and until this step existed nothing
      # automatic ever ran the hook's own suite. That is the failure the suite was
      # written for: a `color_pattern` that stops compiling makes grep exit 2, the
      # gate reads it as "matched nothing", and every commit still looks clean. A
      # gate that has switched itself off is indistinguishable from a working one
      # unless something exercises it, and nothing did.
      #
      # WHAT THIS CANNOT SEE:
      #  * Whether this repository's commits actually went through the hook.
      #    `core.hooksPath` is opt-in per clone and `--no-verify` bypasses it, so a
      #    new colour literal can still reach develop unchallenged. This step says
      #    the gate answers correctly when it is run, not that it was run.
      #  * The colour literals already in lib/. The gate scans added lines only, so
      #    the grandfathered ones are outside its subject, and this step inherits
      #    that scope exactly.
      #  * Whether `dart format` would refuse an unformatted file. The suite points
      #    $DART at a stub that always succeeds -- deliberately, since that gate is
      #    covered by the step above and stubbing it is what lets the suite run
      #    without an SDK. What the rename case asserts is only that the path
      #    reached $DART at all.
      #  * The web-pin gate, for the same reason: it is the first thing the hook
      #    shells out to $DART for.
      #
      # shell: bash for the reason the JavaScript step in flutter-web spells out at length --
      # the runner's default pwsh would not fail the step on a non-zero exit.
      - name: Pre-commit hook gates
        shell: bash
        run: bash tool/hooks/test_pre_commit.sh

      # ---- web dependency / license gate ----
      # web/wasm is gitignored and provisioned from the pins in tool/web_deps.json, exactly
      # like windows/opencv is in the native job above. Only the `upstream` entries can be
      # restored; the recognition core is built by native/wasm/build.sh (emsdk), so it
      # stays absent -- DistributionInfoBuilder discloses what is on disk and lists the rest
      # under "absent" (asserted below). The cache key, the path and the provisioning are in
      # the action; flutter-web uses the same action, and so the same cache.
      - name: Web dependencies
        uses: ./.github/actions/provision-web-deps

      # Exercises the closed-world check behind assets/web_license_info.json: every pinned
      # file present under web/ must hash to its pin, nothing unpinned and unlisted may sit
      # there, and every license text the manifest points at must be committed.
      #
      # What this proves and what it does not:
      #   * It proves the pins still describe what the pinned URLs serve -- on a cache miss
      #     the files above were just re-downloaded from those URLs -- and that the committed
      #     coi-serviceworker.js, the committed license texts and the committed first-party
      #     allowlist are all consistent with the manifest.
      #   * It does NOT validate the committed assets/web_license_info.json. CI cannot build
      #     the emsdk core, so it regenerates a strictly smaller artifact (upstream entries
      #     only) and overwrites the committed one; `git diff --exit-code` would therefore
      #     always fail here. --ci-artifact asserts that smaller shape explicitly instead:
      #     exactly the origin:in-tree entries must be absent, and the status must be the one
      #     that partially provisioned tree earns (`partially_provisioned`, not `verified` --
      #     `verified` means every provisioned_root entry is present, which CI cannot reach),
      #     so the regenerated artifact can no longer shrink unnoticed. Guarding the
      #     committed artifact against locally drifted bytes is the pre-commit hook's job
      #     (tool/hooks/pre-commit runs the same tool/check_web_pins.dart), and gating the
      #     web bundle itself is tool/build_web.sh's.
      #   * It DOES enforce build.sources: the manifest pins the emsdk-built recognition core
      #     against a digest of the native/ sources it was compiled from, and that comparison
      #     needs neither emsdk nor the artifact on disk, so this job catches a pin left behind
      #     by a native/ change even though it cannot build the module. This step is where that
      #     becomes a failure: the pre-commit hook passes --warn-stale-source-digest (rebuilding
      #     needs emsdk, so it must not block a native/-only commit) and therefore only prints.
      #     Do not add that flag here. What the digest proves is `recorded == current tree`; it
      #     cannot see inside the binary, so a repin without a rebuild still passes.
      #
      # DistributionInfoBuilder emits four outputs, not one: build_to is `source`, so this
      # run also rewrites version_info.json, license_info.json and additional_license_info.json
      # (--build-filter decides whether the *builder* runs, not which of its outputs it
      # produces). All of assets/ is therefore restored afterwards, not just the one file.
      # The Windows prebuilts those outputs used to scan are absent in this job, which is why
      # the builder falls back to the committed license texts instead of copying fresh ones.
      #
      # Runs LAST for two reasons. It rewrites a committed file (the builder is
      # build_to: source), which is easiest to reason about once the staleness gate,
      # "Analyze" and "Format check" have already run against the committed tree; and it must
      # not be the first build_runner invocation of the job. A --build-filter run against an
      # *empty* asset graph deletes the committed generated outputs that fall outside the filter
      # (reproduced in a fresh checkout: the lib/** *.mapper.dart / *.gr.dart vanished),
      # whereas one against the warm graph the "Code generation" step above leaves behind
      # does not touch them. Keep this step after that one, and in the same job.
      - name: Verify web license disclosure (build_runner)
        shell: bash
        run: |
          dart run build_runner build --force-jit --build-filter "assets/web_license_info.json"
          dart run tool/check_web_pins.dart --licenses --ci-artifact
          git checkout -- assets

  flutter-web:
    name: Flutter web build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The same action as flutter-test-shards; see the comment there.
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # The focused web-worker tests use only Node's built-in test runner, so no package install is needed.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # shell: bash for the same reason the license step in flutter-static declares it. The runner's
      # default shell on windows-2022 is pwsh, which does not abort on a native command's non-zero exit
      # ($PSNativeCommandUseErrorActionPreference is $false by default, on every pwsh version this
      # image has carried), and GitHub's wrapper only appends `exit $LASTEXITCODE` -- so in a
      # multi-line pwsh step ONLY THE LAST command can fail the step, and a broken
      # test_web_frame_shaping.mjs would ship green. GitHub invokes bash as
      # `bash --noprofile --norc -eo pipefail`, so -e fails the step on the first non-zero exit.
      - name: Run JavaScript tests
        shell: bash
        run: |
          node tool/test_web_frame_shaping.mjs
          node tool/test_web_live_content.mjs
          node tool/test_web_capture_session.mjs
          node tool/test_web_video_import.mjs
          node tool/test_web_video_frame_grab.mjs

      # web/wasm is provisioned from the pins through the same action as in flutter-static; see
      # the comment there.
      - name: Web dependencies
        uses: ./.github/actions/provision-web-deps

      # The video-import DEMUX tests, split out of the JavaScript step above because they need the pinned
      # mediabunny bundle, which only exists under web/wasm/ once the step above has run (or the cache was hit).
      # They mux a clip with mediabunny and read it back through a real Blob + BlobSource, with a registered
      # custom decoder standing in for the WebCodecs VideoDecoder Node does not have.
      #
      # THEY SKIP THEMSELVES when the bundle is absent, so a fresh clone is not red -- which means that HERE a
      # skip is a provisioning failure, not a pass. Read it off the log rather than off the exit code.
      - name: Run video-import demux tests
        shell: bash
        run: node tool/test_web_video_demux.mjs

      # Compiles the web target. The Windows app is built nowhere in CI either, so
      # this is not a packaging step -- it is the only thing that type-checks the
      # web halves of every conditional import (platform_channel_web.dart,
      # fs_backend_web.dart, web_vfs.dart, wasm_worker_client.dart, ...). `flutter
      # test` compiles the *io* halves, so without this a web-only compile error
      # ships green.
      #
      # No build_runner in this job: the build compiles against the committed generated
      # outputs, which flutter-static checks are up to date.
      #
      # NOT tool/build_web.sh: that wrapper passes --require-verified, and a CI
      # tree can never reach `verified` -- the origin:in-tree recognition core is
      # built by emsdk and is legitimately absent here (see flutter-static). The
      # wrapper's other job, --pwa-strategy=none, is passed explicitly instead, so
      # the unreferenced flutter_service_worker.js is not emitted; a Flutter service
      # worker at scope "/" would replay responses without coi-serviceworker.js's
      # COOP/COEP headers and kill cross-origin isolation (and SharedArrayBuffer).
      #
      # Runs after provisioning so the bundle is assembled from the same web/ tree
      # a real build sees. The output is not uploaded: this step is a compile gate.
      #
      # NO EMSDK COMPILE JOB, deliberately, and this is not it. Building
      # native/wasm requires a *Wasm-target* OpenCV static build (SIMD + pthreads);
      # native/wasm/README.md states both prerequisites live outside the repository
      # and are not provisioned by fetch_deps, and nothing in the repo can produce
      # that OpenCV. Adding the job therefore means first adding a wasm-OpenCV
      # supply-chain entry -- a from-source Emscripten OpenCV build (tens of
      # minutes per run, or a cached artifact) plus its own pin/license disclosure
      # under tool/web_deps.json. Until that exists, the C++ side is guarded by the
      # "Check wasm source drift" gate in the native job, which catches the failure
      # mode that actually recurs (a pipeline source nobody added to build.sh).
      - name: Flutter web release build
        run: flutter build web --release --pwa-strategy=none

  browser-tests:
    name: Browser tests
    runs-on: windows-2022
    # The suite bounds every acquisition itself (5 s per assertion) and the whole
    # job takes ~2 min, so this ceiling only catches a browser that never starts.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The same action as the other Flutter jobs. Only `dart` is used below, but
      # that action is what this workflow already uses to obtain it, and its
      # `flutter pub get` is what resolves the Flutter SDK dependencies the
      # package's pubspec declares.
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # Every suite this job runs is `@TestOn('browser')`, so `flutter test` (the VM
      # platform) skips them entirely, and each covers a defect no other job can
      # observe -- `dart:js_interop` semantics that only exist in a real browser
      # and that the analyzer accepts:
      #
      # * record_mutation_lock_web_test.dart -- two CRITICAL defects in
      #   lib/src/core/fs/record_mutation_lock_web.dart around the `Future.toJS` /
      #   `JSPromise.toDart` round trip. The two-level nesting in `runForRecord` is
      #   where the promise used to never settle, hanging the caller and leaking
      #   `umacapture:v1:root` for the lifetime of the page.
      # * storage_persistence_web_test.dart -- lib/src/core/fs/bounded_js_answer.dart,
      #   where `Future.timeout`'s `onTimeout` is checked against the future's
      #   runtime type argument. Returning `null` from it threw a TypeError on every
      #   boot and left OPFS on evictable storage.
      # * bounded_js_answer_web_test.dart -- the generic `awaitBoundedJsAnswer` the
      #   bool wrapper above is now built on. That `onTimeout` check is per
      #   instantiation and dart2js reifies the type argument, so the bool suite
      #   passing says nothing about the object and number instantiations the
      #   storage estimate uses.
      # * origin_storage_estimate_web_test.dart --
      #   lib/src/core/fs/origin_storage_estimate_web.dart, the app's first call to
      #   `navigator.storage.estimate()`. Pins that an engine answers it with
      #   numbers, that the never-settles branch gives up as "unknown", and that an
      #   omitted dictionary member is reported absent rather than converted --
      #   `package:web` types `usage`/`quota` as non-nullable `int` while the IDL
      #   marks both optional.
      # * opfs_delete_failure_web_test.dart -- what a rejected OPFS call hands to
      #   a Dart `catch`. `PathEntity.delete`'s retry catches `Object`, and
      #   whether that may be narrowed to `on FileSystemException` turns on the
      #   measured answer: every reachable failure arrives as a bare `JSObject`
      #   (a DOMException) that is neither `dart:io`'s `FileSystemException` nor
      #   even a Dart `Exception`, so a narrowed clause would select none of
      #   them. It also pins the one failure a retry genuinely recovers on web --
      #   `NoModificationAllowedError`, an entry held by an open writable.
      # * settings_box_deletion_web_test.dart -- what removing a settings box's
      #   backing storage does while `StorageBox.ensureOpened` still holds it
      #   open, on the platform where a box is an IndexedDB database rather than
      #   a file. The answer decides how the storage tab may delete settings.
      # * fs_metadata_web_test.dart -- the browser facts the web side of
      #   `FsBackend.modified` / a metadata-carrying `FsBackend.list` rests on:
      #   a `FileSystemFileHandle` yields size and `lastModified` off a handle
      #   the walk already holds, and a `FileSystemDirectoryHandle` exposes no
      #   metadata member at all, which is why the directory case throws
      #   `UnsupportedError` instead of inventing a timestamp.
      # * fs_ranged_read_web_test.dart -- the browser facts `WebVfs.readHead`
      #   rests on: the `File` off a handle is a `Blob`, `slice(0, n)` settles
      #   its length before any byte is fetched and yields exactly the first n
      #   bytes, and an end offset past the file is clamped rather than
      #   rejected. Without those, the web half of `FsBackend.readHead` would
      #   have to read the file and cut -- the read the bound exists to prevent.
      # * settings_value_render_web_test.dart -- that a settings value written to a
      #   store comes back unchanged on the platform where a store is an IndexedDB
      #   database rather than a file, and that SD11's rendering tiers pick the same
      #   answer there as on Windows. The storage tab's settings group exists in that
      #   shape precisely because web has no file to show, so the VM suites assert
      #   its contents against a platform it never runs on.
      # * storage_zip_export_web_test.dart -- that a folder read out of real OPFS
      #   comes back out of the storage tab's zip assembler unchanged, and that
      #   the browser's size limit holds the value it states after `dart2js` has
      #   compiled it. The archive is built in the tab's own memory from typed
      #   arrays the browser handed over, and neither of those is what the VM
      #   suite runs even though it runs the same production functions.
      #
      # WHICH FILES: tool/test_selection.dart picks every test/**/*_test.dart whose library
      # carries `@TestOn('browser')`, so a new browser-only suite runs here without an edit to the
      # command below (and a file with any other @TestOn selector fails the selection until
      # someone decides which job owns it). Add a line for a new suite to the list above all the
      # same: the list is why each suite exists, not what makes it run.
      #
      # `dart test`, not `flutter test --platform chrome`: the suite has no
      # Flutter dependency, and the flutter runner has to compile the whole
      # framework for the browser first (observed to sit at "loading" for 40+ min
      # locally). `dart test --platform chrome` compiles and runs it in ~15 s.
      # `package:test` resolves transitively through `flutter_test`, so no
      # dev_dependency is needed.
      #
      # No build_runner step: the lib/ closure of the ten suites above is
      # record_mutation_lock{,_shared,_web}.dart, bounded_js_answer.dart,
      # origin_storage_estimate_web.dart, settings_value_render.dart with the
      # json_format.dart it imports, and zip_bundle.dart with
      # zip_export_limit.dart; outside lib/ it is test/support/zip_layout_cases.dart
      # and the packages web, hive_ce and archive. (The other four --
      # opfs_delete_failure, fs_metadata, fs_ranged_read and settings_box_deletion
      # -- import no lib/ source at all: they drive the browser and hive_ce
      # directly, which is stated at the top of each of those files.) None of that
      # is generated, and the committed generated outputs cover the rest. Keep it
      # that way: a suite that reaches package:flutter cannot be compiled by
      # `dart test`. When a browser suite is added, re-derive this list from its
      # imports rather than assuming it changed nothing.
      #
      # Chrome comes from the windows-2022 image; package:test finds it via
      # CHROME_EXECUTABLE / CHROME_PATH, else %LOCALAPPDATA%/%PROGRAMFILES%
      # /%PROGRAMFILES(X86)%\Google\Chrome\Application\chrome.exe. Both silent-skip
      # routes were checked and are red, not green: an unlaunchable Chrome exits 1
      # ("Failed to run Chrome"), and a run where @TestOn matches nothing exits 79
      # ("No tests ran"). Do not add `|| true`, and do not make this step
      # conditional on Chrome being detected.
      #
      # shell: bash for the reason spelled out on "Run JavaScript tests" in flutter-web --
      # the runner's default pwsh does not abort on a native command's non-zero
      # exit, so a failing suite could ship green. Under bash -e the assignment below also fails
      # the step when the selection does, before `dart test` could run with no file arguments
      # (which would mean the whole test/ directory).
      - name: Run browser tests
        shell: bash
        run: |
          files="$(dart tool/test_selection.dart browser)"
          dart test --platform chrome $files
