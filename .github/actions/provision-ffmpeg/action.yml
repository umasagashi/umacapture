name: Provision FFmpeg
description: >-
  Restores windows/ffmpeg from the Actions cache, or provisions it with tool/fetch_deps.py on a
  miss. Every job that needs FFmpeg -- in ci.yml and in warm-caches.yml -- goes through this
  action, so the cache key and path are defined here and nowhere else.

# FFmpeg (BtbN n7.1.5 LGPL shared) is linked only by umacapture_ffv1_tests (the FFV1
# recorder/reader round-trip) and umacapture_mimic_player; umacapture_tests stays opencv-only.
# Cached like OpenCV; the "-slim" key matches the pruned layout. Bump this key when the ffmpeg pin
# in tool/fetch_deps.py changes -- and note that the FFmpeg version alone is not enough to key on:
# BtbN re-hosts the same build under several autobuild tags with differing archive bytes, so a
# re-pin can leave "n7.1.5" unchanged. The date suffix is the pinned tag's, which is what actually
# distinguishes one archive from the next.
#
# The key and path are defined once because a pull request restores the copy warm-caches.yml saved
# on develop only when both agree with it (see the comment at the top of setup-flutter/action.yml).
runs:
  using: composite
  steps:
    - name: Cache FFmpeg n7.1.5
      id: cache
      uses: actions/cache@v4
      with:
        path: windows/ffmpeg
        key: ffmpeg-n7.1.5-lgpl-shared-slim-20260630

    # uv's own cache is off for the reason given in provision-opencv/action.yml.
    - name: Set up uv
      if: steps.cache.outputs.cache-hit != 'true'
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: false

    - name: Provision FFmpeg n7.1.5
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: uv run tool/fetch_deps.py --only ffmpeg --slim
