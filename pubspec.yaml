name: umacapture
description: Application for the game Umamusume players.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.10

# Flutter 3.44.0 (Dart SDK 3.12.0). Use `fvm use` to install.
environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  archive: ^4.0.9
  audioplayers: ^6.7.0
  auto_route: ^11.0.0
  badges: ^3.2.0
  charset: ^2.0.1
  collection: ^1.16.0
  csv: ^8.0.0
  dart_mappable: ^4.8.0
  dio: ^5.9.2
  easy_localization: ^3.0.1
  equatable: ^2.0.5
  feedback: ^3.2.0
  feedback_sentry: ^3.2.0
  # TODO(deps): swap to a stable file_picker 12 once released. 12.0.0-beta.5 uses win32 ^6 and is
  # the only version consistent with the latest set (win32 6) such as package_info_plus 10 / window_manager 0.5.
  # The stable 11 line uses win32 ^5.9 and conflicts with that latest set.
  file_picker: ^12.0.0-beta.5
  fl_chart: ^1.2.0
  flex_color_scheme: ^8.4.0
  flutter_markdown_plus: ^1.0.7
  flutter_native_splash: ^2.2.8
  flutter_rating_bar: ^4.0.1
  flutter_riverpod: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^8.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  image: ^4.8.0
  intl: ^0.20.2
  logger: ^2.7.0
  markdown: ^7.3.1
  package_info_plus: ^10.1.0
  pasteboard: ^0.5.0
  path: ^1.8.1
  path_provider: ^2.0.11
  percent_indicator: ^4.2.2
  trina_grid: ^2.2.2
  quiver: ^3.1.0
  recase: ^4.0.0
  sentry_flutter: ^9.21.0
  state_notifier: ^1.0.0
  table_calendar: ^3.0.6
  tuple: ^2.0.0
  url_launcher: ^6.1.5
  uuid: ^4.5.3
  version: ^3.0.2
  window_manager: ^0.5.1
  yaml: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  auto_route_generator: ^10.4.0
  build_runner: ^2.2.0
  dart_mappable_builder: ^4.8.0
  flutter_lints: ^6.0.0
  flutter_oss_licenses: ^3.2.0
  msix: ^3.6.3


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/translations/
    - assets/license/
    - assets/sound/
    - assets/image/
    - assets/config/
    - assets/config/chara_detail/
