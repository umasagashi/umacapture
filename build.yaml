builders:
  distribution_info:
    import: "package:umacapture/distribution_info.dart"
    builder_factories: [ "distributionInfoBuilder" ]
    build_extensions: { "pubspec.yaml": [ "assets/version_info.json", "assets/license_info.json" ] }
    build_to: source
    auto_apply: root_package

targets:
  $default:
    builders:
      distribution_info:
        generate_for:
          - pubspec.yaml

      dart_mappable_builder:
        options:
          # Do not generate copy/equals/stringify (keep hand-written copyWith and Equatable to avoid conflicts).
          # caseStyle is specified per class via @MappableClass(caseStyle: ...) (default is no conversion).
          generateMethods: [ "decode", "encode" ]
